<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GyroPi — Performer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
      gap: 20px;
    }
    h2 { color: #4ecca3; letter-spacing: 2px; font-size: 1.3rem; }
    #status { font-size: 13px; color: #aaa; }
    canvas { border: 2px solid #4ecca3; border-radius: 50%; }
    #angles {
      display: flex;
      gap: 40px;
      font-size: 1.1rem;
      font-family: monospace;
    }
    .angle-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .angle-label { color: #aaa; font-size: 0.85rem; letter-spacing: 1px; }
    .angle-value { color: #4ecca3; font-size: 2rem; font-weight: bold; }
    #level-display {
      font-size: 1rem;
      color: #aaa;
      letter-spacing: 1px;
    }
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.80);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      color: #4ecca3;
      gap: 12px;
    }
  </style>
</head>
<body>
  <h2>GyroPi — Performer</h2>
  <p id="status">Connecting...</p>

  <!-- Bubble level canvas -->
  <canvas id="c" width="260" height="260"></canvas>

  <!-- Numeric readout -->
  <div id="angles">
    <div class="angle-box">
      <span class="angle-label">PITCH</span>
      <span class="angle-value" id="pitch-val">0.0°</span>
    </div>
    <div class="angle-box">
      <span class="angle-label">ROLL</span>
      <span class="angle-value" id="roll-val">0.0°</span>
    </div>
  </div>

  <div id="level-display">LEVEL — / —</div>

  <div id="overlay"><div id="overlay-msg"></div></div>

<script>
const statusEl   = document.getElementById('status');
const pitchEl    = document.getElementById('pitch-val');
const rollEl     = document.getElementById('roll-val');
const levelEl    = document.getElementById('level-display');
const canvas     = document.getElementById('c');
const ctx        = canvas.getContext('2d');

const CX = canvas.width  / 2;
const CY = canvas.height / 2;
const OUTER_R   = 110;  // outer ring radius
const BUBBLE_R  = 22;   // bubble dot radius
const MAX_TILT  = 30;   // degrees at which bubble reaches the edge

let pitch = 0, roll = 0, level = 1, totalLevels = 2;

// ── WebSocket ─────────────────────────────────────────────────────────────────
const ws = new WebSocket(`ws://${location.host}`);

ws.onopen  = () => statusEl.textContent = 'Connected — tilt the board!';
ws.onclose = () => statusEl.textContent = 'Disconnected';

ws.onmessage = e => {
  const msg = JSON.parse(e.data);

  if (msg.type === 'game_state') {
    pitch        = msg.pitch;
    roll         = msg.roll;
    level        = msg.level;
    totalLevels  = 2;  // matches GyroPiGame level count
    pitchEl.textContent = `${pitch.toFixed(1)}°`;
    rollEl.textContent  = `${roll.toFixed(1)}°`;
    levelEl.textContent = `LEVEL ${level} / ${totalLevels}`;

  } else if (msg.type === 'game_over') {
    document.getElementById('overlay-msg').textContent =
      msg.win ? '🎉 You win!' : 'Game over';
    document.getElementById('overlay').style.display = 'flex';
  }
};

// ── Rendering ─────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Outer ring
  ctx.beginPath();
  ctx.arc(CX, CY, OUTER_R, 0, Math.PI * 2);
  ctx.strokeStyle = '#4ecca3';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#0f3460';
  ctx.fill();

  // Cross-hair guides
  ctx.strokeStyle = 'rgba(78,204,163,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(CX - OUTER_R, CY); ctx.lineTo(CX + OUTER_R, CY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX, CY - OUTER_R); ctx.lineTo(CX, CY + OUTER_R); ctx.stroke();

  // Centre target dot
  ctx.beginPath();
  ctx.arc(CX, CY, 5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(78,204,163,0.4)';
  ctx.fill();

  // Bubble position — clamp to inside the outer ring
  const clamp = MAX_TILT === 0 ? 0 : 1;
  const rawBx = (roll  / MAX_TILT) * (OUTER_R - BUBBLE_R);
  const rawBy = (pitch / MAX_TILT) * (OUTER_R - BUBBLE_R);
  const dist  = Math.sqrt(rawBx * rawBx + rawBy * rawBy);
  const maxD  = OUTER_R - BUBBLE_R;
  const scale = dist > maxD ? maxD / dist : 1;
  const bx    = CX + rawBx * scale;
  const by    = CY + rawBy * scale;

  // Bubble glow
  const glow = ctx.createRadialGradient(bx - 5, by - 5, 2, bx, by, BUBBLE_R);
  glow.addColorStop(0, '#aaddff');
  glow.addColorStop(1, '#1a6abf');
  ctx.beginPath();
  ctx.arc(bx, by, BUBBLE_R, 0, Math.PI * 2);
  ctx.fillStyle = glow;
  ctx.fill();
  ctx.strokeStyle = '#4ecca3';
  ctx.lineWidth = 2;
  ctx.stroke();

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
