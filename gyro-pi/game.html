<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GyroPi — Communicator View</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
      gap: 12px;
    }
    h2 { color: #4ecca3; letter-spacing: 2px; font-size: 1.3rem; }
    #wrap { position: relative; }
    canvas { display: block; border: 2px solid #4ecca3; border-radius: 6px; }
    #status { font-size: 13px; color: #aaa; }
    #win-screen {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 1.8rem;
      font-weight: bold;
      color: #4ecca3;
      gap: 16px;
    }
    #win-screen button {
      padding: 10px 28px;
      font-size: 1rem;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    #win-screen button:hover { background: #3ab88d; }
  </style>
</head>
<body>
  <h2>GyroPi — Communicator View</h2>
  <div id="wrap">
    <canvas id="c" width="600" height="500"></canvas>
    <div id="win-screen">
      <div>You reached the goal!</div>
      <button onclick="resetGame()">Play Again</button>
    </div>
  </div>
  <div id="status">Connecting to gyro...</div>

<script>
// ── Maze ──────────────────────────────────────────────────────────────────────
const WALLS = [
  // Border
  {x:0,   y:0,   w:600, h:15},
  {x:0,   y:485, w:600, h:15},
  {x:0,   y:0,   w:15,  h:500},
  {x:585, y:0,   w:15,  h:500},
  // Divider 1 — splits top / middle corridor, gap on RIGHT (x=415–585)
  {x:15,  y:165, w:400, h:15},
  // Divider 2 — splits middle / bottom corridor, gap on LEFT (x=15–200)
  {x:200, y:330, w:385, h:15},
  // Extra wall in top corridor (ball must navigate around it)
  {x:180, y:80,  w:160, h:15},
  // Dead-end wall in middle corridor (black hole trap on the right)
  {x:360, y:220, w:15,  h:110},
];

const HOLES = [
  {x:280, y:122, r:18},   // top area — below the extra wall
  {x:470, y:255, r:18},   // middle area — dead end
  {x:100, y:410, r:18},   // bottom area — wrong direction
];

const GOAL  = {x:545, y:435, r:25};
const START = {x:45,  y:85};
const BALL_R = 14;

// ── State ─────────────────────────────────────────────────────────────────────
let bx = START.x, by = START.y;
let vx = 0, vy = 0;
let pitch = 0, roll = 0;
let gameWon = false;
let flashMsg = '', flashTimer = 0;
let lastTime = null;

// ── Keyboard fallback ─────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true;  e.preventDefault(); });
window.addEventListener('keyup',   e => { keys[e.key] = false; });

// ── WebSocket ─────────────────────────────────────────────────────────────────
const statusEl = document.getElementById('status');
const wsUrl    = `ws://${location.hostname}:8765`;
let ws;

function connectWS() {
  ws = new WebSocket(wsUrl);
  ws.onopen    = () => statusEl.textContent = `Connected — gyro @ ${wsUrl}`;
  ws.onclose   = () => { statusEl.textContent = 'Gyro disconnected — using arrow keys'; setTimeout(connectWS, 2000); };
  ws.onerror   = ()  => statusEl.textContent = 'No gyro — using arrow keys (Up/Down/Left/Right)';
  ws.onmessage = e  => { const d = JSON.parse(e.data); pitch = d.pitch; roll = d.roll; };
}
connectWS();

// ── Physics ───────────────────────────────────────────────────────────────────
const G            = 1350;  // effective gravity in px/s² (tune for feel)
const ROLL_FRICTION = 2.0;  // rolling friction — higher = ball stops faster when level
const WALL_BOUNCE   = 0.25; // energy kept on wall hit (0 = dead stop, 1 = elastic)

function update(dt) {
  let tx = roll,  ty = pitch;
  if (keys['ArrowLeft'])  tx -= 20;
  if (keys['ArrowRight']) tx += 20;
  if (keys['ArrowUp'])    ty -= 20;
  if (keys['ArrowDown'])  ty += 20;

  // Tilt angle → gravitational acceleration (sin for realism at larger angles)
  vx += Math.sin(tx * Math.PI / 180) * G * dt;
  vy += Math.sin(ty * Math.PI / 180) * G * dt;

  // Rolling friction: exponential decay so it's frame-rate independent
  const fric = Math.exp(-ROLL_FRICTION * dt);
  vx *= fric;
  vy *= fric;

  bx += vx * dt;
  by += vy * dt;

  for (const w of WALLS) resolveWall(w);

  // Black holes — reset ball to start
  for (const h of HOLES) {
    if (dst(bx, by, h.x, h.y) < h.r + BALL_R) {
      bx = START.x; by = START.y;
      vx = 0; vy = 0;
      flashMsg = 'Fell into a black hole — back to start!';
      flashTimer = 2.5;
      return;
    }
  }

  // Goal
  if (dst(bx, by, GOAL.x, GOAL.y) < GOAL.r) {
    gameWon = true;
    document.getElementById('win-screen').style.display = 'flex';
  }

  flashTimer = Math.max(0, flashTimer - dt);
}

function resolveWall(w) {
  const cx = Math.max(w.x, Math.min(bx, w.x + w.w));
  const cy = Math.max(w.y, Math.min(by, w.y + w.h));
  const dx = bx - cx, dy = by - cy;
  const d  = Math.sqrt(dx * dx + dy * dy);
  if (d < BALL_R && d > 0) {
    const nx = dx / d, ny = dy / d;
    // Push ball out of wall
    bx += nx * (BALL_R - d);
    by += ny * (BALL_R - d);
    // Reflect velocity with energy loss (only when moving into wall)
    const dot = vx * nx + vy * ny;
    if (dot < 0) {
      vx -= (1 + WALL_BOUNCE) * dot * nx;
      vy -= (1 + WALL_BOUNCE) * dot * ny;
    }
  }
}

function dst(ax, ay, bx2, by2) {
  return Math.sqrt((ax - bx2) ** 2 + (ay - by2) ** 2);
}

function resetGame() {
  bx = START.x; by = START.y;
  vx = 0; vy = 0;
  gameWon = false;
  flashMsg = ''; flashTimer = 0;
  document.getElementById('win-screen').style.display = 'none';
  lastTime = null;
  requestAnimationFrame(loop);
}

// ── Rendering ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function draw() {
  // Background
  ctx.fillStyle = '#0f3460';
  ctx.fillRect(0, 0, 600, 500);

  // Walls
  ctx.fillStyle = '#2c3e50';
  for (const w of WALLS) ctx.fillRect(w.x, w.y, w.w, w.h);

  // Wall highlights (top edge)
  ctx.fillStyle = '#3d566e';
  for (const w of WALLS) ctx.fillRect(w.x, w.y, w.w, 3);

  // Black holes
  for (const h of HOLES) {
    const g = ctx.createRadialGradient(h.x - 4, h.y - 4, 2, h.x, h.y, h.r);
    g.addColorStop(0, '#000');
    g.addColorStop(1, '#3d0066');
    ctx.beginPath();
    ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = '#9b00ff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Goal
  const gg = ctx.createRadialGradient(GOAL.x, GOAL.y, 4, GOAL.x, GOAL.y, GOAL.r);
  gg.addColorStop(0, '#00ffaa');
  gg.addColorStop(1, '#007744');
  ctx.beginPath();
  ctx.arc(GOAL.x, GOAL.y, GOAL.r, 0, Math.PI * 2);
  ctx.fillStyle = gg;
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('GOAL', GOAL.x, GOAL.y + 4);

  // Start marker
  ctx.fillStyle = '#ffaa00';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('START', 20, 62);

  // Ball
  const bg = ctx.createRadialGradient(bx - 4, by - 4, 2, bx, by, BALL_R);
  bg.addColorStop(0, '#aaddff');
  bg.addColorStop(1, '#1a6abf');
  ctx.beginPath();
  ctx.arc(bx, by, BALL_R, 0, Math.PI * 2);
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = '#4ecca3';
  ctx.lineWidth = 2;
  ctx.stroke();

  // HUD — tilt data
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(4, 430, 110, 52);
  ctx.fillStyle = '#ccc';
  ctx.font = '10px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`pitch: ${pitch.toFixed(1)}°`, 10, 447);
  ctx.fillText(`roll:  ${roll.toFixed(1)}°`,  10, 461);
  ctx.fillText(`v: (${vx.toFixed(0)}, ${vy.toFixed(0)})`, 10, 475);

  // Flash message (black hole warning)
  if (flashTimer > 0) {
    ctx.fillStyle = 'rgba(180,0,0,0.82)';
    roundRect(ctx, 120, 210, 360, 56, 8);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(flashMsg, 300, 244);
  }
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

// ── Game loop ─────────────────────────────────────────────────────────────────
function loop(ts) {
  if (gameWon) return;
  if (!lastTime) lastTime = ts;
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
